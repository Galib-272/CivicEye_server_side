# Local development dependencies for CivicEye. Not used in production.
# Start: docker compose up -d    Stop: docker compose down    Reset data: docker compose down -v
name: civiceye

services:
  postgres:
    # PostgreSQL 17 + PostGIS 3, built for the host architecture (see docker/postgis/Dockerfile).
    # Credentials are local-development placeholders only.
    build: ./docker/postgis
    image: civiceye-postgis:17
    environment:
      POSTGRES_USER: civiceye
      POSTGRES_PASSWORD: civiceye_dev_password
      POSTGRES_DB: civiceye
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civiceye -d civiceye']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # S3-compatible object storage for local development (production uses Cloudflare R2).
    # Credentials in docker/seaweedfs/s3.json are local-development placeholders only.
    image: chrislusf/seaweedfs:3.97
    command: ['server', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - storage-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    # Catches outgoing email in development (used from Phase 2). Web UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
  redis-data:
  storage-data:
